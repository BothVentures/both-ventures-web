<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─────────────────────────────────────────
   TOKENS — Both_Ventures locked palette
   ID 01 · Institutional = paper · ID 02 · System = ink
───────────────────────────────────────── */
:root{
  --paper:oklch(94% 0.010 85);
  --ink:oklch(17% 0.006 60);
  --black:#000000;
  --signal:oklch(56% 0.10 108);          /* olive-teal — the one accent */

  --bg:var(--paper);
  --fg:var(--ink);
  --fg-mid:oklch(17% 0.006 60 / 0.68);
  --fg-faint:oklch(17% 0.006 60 / 0.42);
  --line:oklch(17% 0.006 60 / 0.10);
  --line-mid:oklch(17% 0.006 60 / 0.16);
  --line-strong:oklch(17% 0.006 60 / 0.42);
  --line-ghost:oklch(17% 0.006 60 / 0.03);

  --serif:'Fraunces',Georgia,serif;
  --mono:'Space Mono',ui-monospace,monospace;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
}

[data-theme="dark"]{
  --bg:var(--black);
  --fg:oklch(97% 0.004 85);
  --fg-mid:oklch(97% 0.004 85 / 0.62);
  --fg-faint:oklch(97% 0.004 85 / 0.38);
  --line:oklch(97% 0.004 85 / 0.10);
  --line-mid:oklch(97% 0.004 85 / 0.15);
  --line-strong:oklch(97% 0.004 85 / 0.40);
  --line-ghost:oklch(97% 0.004 85 / 0.04);
  --signal:oklch(72% 0.11 108);
}

html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--mono);
  background:var(--bg);
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background 0.45s var(--ease-out),color 0.45s var(--ease-out);
}
::selection{background:var(--signal);color:var(--bg)}

a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:4px}

/* ─────────────────────────────────────────
   HERO — poster composition (PCS v4, verbatim)
───────────────────────────────────────── */
.hero{
  position:relative;
  width:100vw;
  height:100svh;
  min-height:600px;
  overflow:hidden;
}
#heroCanvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  z-index:1;
}

.hero-wordmark{
  position:absolute;
  top:7vh;left:6vw;
  font-family:var(--serif);
  font-variation-settings:'opsz' 9;   /* text cut — same as the footer wordmark */
  font-size:clamp(25.3px, 3.26vw, 50.6px);
  font-weight:424;
  line-height:1.08;
  letter-spacing:-0.01em;
  color:var(--fg);
  text-align:left;
  white-space:nowrap;
  z-index:10;
  pointer-events:none;
}
.hero-wordmark .us{
  color:var(--fg);
  font-weight:424;
}
[data-theme="dark"] .hero-wordmark .us{animation:cursor 1.1s steps(1,end) infinite}
@keyframes cursor{0%,55%{opacity:1}56%,100%{opacity:0.18}}

.hero-pillars{
  position:absolute;
  bottom:14vh;left:6vw;
  font-family:var(--serif);
  font-variation-settings:'opsz' 144;
  font-size:clamp(29.4px, 3.84vw, 58.8px);
  font-weight:318;
  line-height:1.2;
  letter-spacing:-0.02em;
  color:var(--fg);
  z-index:10;
  pointer-events:none;
}
.hero-pillars em{font-style:italic;font-weight:318}

.hero-footer{
  position:absolute;
  bottom:0;left:0;right:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:2.4vh 6vw 2.8vh;
  z-index:10;
  border-top:1px solid var(--line);
}
.f-col{
  font-size:clamp(10.2px, 0.88vw, 13px);
  font-weight:424;
  line-height:1.65;
  color:var(--fg-mid);
  letter-spacing:0.015em;
}
.f-col{white-space:nowrap}
.f-col time{font-variant-numeric:tabular-nums}
.f-col.right{text-align:right}

/* PAGE FOOTER */
.page-footer{
  padding:40px 6vw;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;flex-wrap:wrap;
}
.pf-brand{
  font-family:var(--serif);
  font-size:clamp(13px, 1vw, 16px);
  font-weight:400;
  letter-spacing:0;
  color:var(--fg);
}
.pf-brand .us{color:var(--fg)}
.pf-meta{
  font-size:clamp(9px, 0.72vw, 11px);
  color:var(--fg-faint);
  letter-spacing:0.04em;
}

.page-footer{position:relative;z-index:6}

/* PAPER TINT — the Punta Crypto light-mode yellow, verbatim */
#yellowOverlay{position:fixed;inset:0;background:#FFD700;opacity:0.55;mix-blend-mode:multiply;pointer-events:none;z-index:5}
[data-theme="dark"] #yellowOverlay{display:none}

/* THEME TOGGLE — paper ↔ ink = ID 01 ↔ ID 02 */
.theme-toggle{
  position:fixed;right:24px;z-index:500;
  top:calc(7vh + 0.54 * clamp(25.3px, 3.26vw, 50.6px) - 18px);
  --glass:oklch(97% 0.004 85 / 0.08);
  --glass-hover:oklch(97% 0.004 85 / 0.16);
  --glass-line:oklch(97% 0.004 85 / 0.22);
  --glass-glint:oklch(97% 0.004 85 / 0.35);
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:999px;
  box-shadow:inset 0 1px 0 var(--glass-glint);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  backdrop-filter:blur(24px) saturate(140%);
  color:var(--fg);
  font-family:var(--mono);
  font-size:0.6rem;
  letter-spacing:0.14em;text-transform:uppercase;
  padding:11px 18px;
  min-height:36px;
  cursor:pointer;
  transition:background 0.35s var(--ease-out),border-color 0.35s var(--ease-out),transform 0.35s var(--ease-out);
}
.theme-toggle:hover{background:var(--glass-hover);transform:translateY(-1px)}
.theme-toggle:active{transform:translateY(0)}
:root:not([data-theme="dark"]) .theme-toggle{
  --glass:oklch(99% 0.005 90 / 0.34);
  --glass-hover:oklch(99% 0.005 90 / 0.55);
  --glass-line:oklch(17% 0.006 60 / 0.16);
  --glass-glint:oklch(100% 0 0 / 0.7);
}


@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  [data-theme="dark"] .hero-wordmark .us{animation:none}
  .btn-ink::after{transition:none}
}

/* ─── MOBILE ─── */
@media(max-width:700px){
  .hero-wordmark{font-size:clamp(19.9px,5.44vw,30.7px);top:5vh;left:5vw}
  .theme-toggle{top:calc(5vh + 0.54 * clamp(19.9px,5.44vw,30.7px) - 18px)}
  .hero-pillars{font-size:clamp(22.6px,6.1vw,36.2px);bottom:12vh;left:5vw}
  .hero-footer{padding:1.8vh 5vw 2vh;gap:6px}
  .f-col{font-size:clamp(9px,2.5vw,12.4px)}
}
@media(max-width:480px){
  .hero-footer .f-col:nth-child(2){display:none}
  .f-col .tz{display:none}
}
</style>
</head>
<body>

<div id="yellowOverlay" aria-hidden="true"></div>
<button class="theme-toggle" id="themeToggle" aria-label="Switch to paper (light) mode">◐ &nbsp;Paper</button>

<!-- ══════════════════════════════════════
     HERO — POSTER
══════════════════════════════════════ -->
<section class="hero" aria-label="Both_Ventures">
  <canvas id="heroCanvas" aria-hidden="true"></canvas>

  <h1 class="hero-wordmark">Both<span class="us">_</span>Ventures®</h1>

  <p class="hero-pillars">
    Builds<br>
    Accelerates<br>
    <em>Interconnects</em>
  </p>

  <div class="hero-footer">
    <div class="f-col">
      Both_Ventures® all rights reserved. 2026
    </div>
    <div class="f-col">
      Punta del Este, Uruguay
    </div>
    <div class="f-col right">
      <time id="clock" aria-label="Current time in Punta del Este">--:--:--</time>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════
     PAGE FOOTER
══════════════════════════════════════ -->
<footer class="page-footer">
  <div class="pf-brand">Both<span class="us">_</span>Ventures®</div>
  <div class="pf-meta">Manantial Casa · Punta del Este, Uruguay · 34°57′S · 54°57′W · UTC−03</div>
  <div class="pf-meta">© 2026 · permanent beta · powered by Synergy</div>
</footer>

<script>
// ═══════════════════════════════════════════════════════
//  METABALL ENGINE — lifted verbatim from Punta Crypto Summit v4
//  (code-ASCII shade ramp · metaball field · Phong · spring physics)
// ═══════════════════════════════════════════════════════
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─── GRAIN ───────────────────────────────────────────────
const GRAIN_SIZE = 512;
const grainOffscreen = document.createElement('canvas');
grainOffscreen.width = grainOffscreen.height = GRAIN_SIZE;
(function(){
  const gc = grainOffscreen.getContext('2d');
  const gd = gc.createImageData(GRAIN_SIZE, GRAIN_SIZE);
  for (let i=0; i<gd.data.length; i+=4) {
    const v = Math.floor(Math.random()*255);
    gd.data[i]=gd.data[i+1]=gd.data[i+2]=v; gd.data[i+3]=28;
  }
  gc.putImageData(gd, 0, 0);
})();
function tileGrain(ctx, x0, y0, x1, y1, gx, gy, alpha) {
  ctx.save();
  ctx.globalCompositeOperation=isDark?'screen':'multiply'; ctx.globalAlpha=alpha;
  const ox0=Math.floor((x0+gx)/GRAIN_SIZE)*GRAIN_SIZE-gx;
  const oy0=Math.floor((y0+gy)/GRAIN_SIZE)*GRAIN_SIZE-gy;
  for (let ox=ox0; ox<x1+GRAIN_SIZE; ox+=GRAIN_SIZE)
    for (let oy=oy0; oy<y1+GRAIN_SIZE; oy+=GRAIN_SIZE)
      ctx.drawImage(grainOffscreen, ox, oy);
  ctx.restore();
}

// ─── CODE ASCII SHADE RAMP (dense → sparse) ──────────────
const SHADE_BANDS = [
  '@#$WM',   // 0 — darkest (deep shadow)
  '&%8BQ',   // 1
  '0OGbd',   // 2
  '(){}[',   // 3
  ']/\\|!',  // 4
  '*=<>+',   // 5
  '~-_;:',   // 6
  ',. `',    // 7 — lightest (specular highlight)
];
const SB_N = SHADE_BANDS.length;

function getChar(bright, px, py, t) {
  const band = Math.min(SB_N-1, Math.floor(bright * SB_N));
  const row  = SHADE_BANDS[band];
  const spd  = 0.30 + (1 - bright) * 1.4;
  return row[Math.abs(Math.floor(t*spd + px*0.19 + py*0.13)) % row.length];
}

// ─── GLITTER ─────────────────────────────────────────────
function makeGlitter(n) {
  const pts=[];
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, d=Math.sqrt(Math.random())*0.85;
    pts.push({dx:Math.cos(a)*d, dy:Math.sin(a)*d, sz:Math.random()*0.004+0.001, ph:Math.random()*Math.PI*2, sp:1.5+Math.random()*4});
  }
  return pts;
}
function drawGlitter(ctx, cx, cy, r, pts, t) {
  ctx.save(); ctx.globalCompositeOperation='source-over';
  pts.forEach(p=>{
    const a=Math.max(0,Math.sin(t*p.sp+p.ph));
    if (a<0.06) return;
    ctx.beginPath();
    ctx.arc(cx+p.dx*r, cy+p.dy*r, p.sz*r, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,254,250,${(a*0.85).toFixed(2)})`; ctx.fill();
  });
  ctx.restore();
}

// ─── PHYSICS — smooth, lazy, elastic ─────────────────────
const SPRING_K=0.006, DAMPING=0.91, MAX_SPEED=22;

function updateBlobs(blobs, mouse, tilt) {
  const n=blobs.length;
  blobs.forEach((b,i)=>{
    b.vx+=(b.hx-b.x)*SPRING_K;
    b.vy+=(b.hy-b.y)*SPRING_K;

    // Mouse/touch push — hermite smooth-step, no hard edge
    if (mouse.sx>-999) {
      const mdx=b.x-mouse.sx, mdy=b.y-mouse.sy;
      const md2=mdx*mdx+mdy*mdy, mr=b.r*2.5;
      if (md2<mr*mr) {
        const md=Math.sqrt(md2)||1, u=md/mr;
        const sm=u*u*(3-2*u), f=(1-sm)*(1-sm)*6;
        b.vx+=(mdx/md)*f; b.vy+=(mdy/md)*f;
      }
    }

    // Ambient gravity (mobile Lissajous)
    if (tilt.active) {
      b.vx+=tilt.sx*5.0;
      b.vy+=tilt.sy*5.0;
    }

    // Minimal center-overlap repulsion
    for (let j=i+1;j<n;j++) {
      const b2=blobs[j],dx=b.x-b2.x,dy=b.y-b2.y;
      const d2=dx*dx+dy*dy,min=(b.r+b2.r)*0.20;
      if (d2<min*min) {
        const d=Math.sqrt(d2)||1,ov=1-d/min,f=ov*ov*4,nx=dx/d,ny=dy/d;
        b.vx+=nx*f;b.vy+=ny*f;b2.vx-=nx*f;b2.vy-=ny*f;
      }
    }

    b.vx*=DAMPING; b.vy*=DAMPING;
    const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if (spd>MAX_SPEED){b.vx=b.vx/spd*MAX_SPEED;b.vy=b.vy/spd*MAX_SPEED;}
    b.x+=b.vx; b.y+=b.vy;
  });
}

// ─── LIGHT ───────────────────────────────────────────────
const _L=(function(){const x=-0.45,y=-0.55,z=0.70,n=Math.sqrt(x*x+y*y+z*z);return{x:x/n,y:y/n,z:z/n};})();

// ─── METABALL + CODE-ASCII RENDERER ──────────────────────
const GRID=7; // character pitch in px

let isDark = true;
function bgColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || (isDark?'#000000':'#F0EDE8'); }

function drawMetaballs(ctx, blobs, t, grainX, grainY, W, H, transparent) {
  if (!transparent){ctx.fillStyle=bgColor(); ctx.fillRect(0,0,W,H);}
  else{ctx.clearRect(0,0,W,H);}

  const THRESH=1.0, lx=_L.x, ly=_L.y, lz=_L.z;
  const br=blobs.map(b=>b.r*(1+Math.sin(t*0.52+b.ph*0.6)*0.016));

  ctx.font=`${GRID+1}px "Space Mono","JetBrains Mono",monospace`;
  ctx.textBaseline='middle'; ctx.textAlign='center';
  let prevStyle='';

  for (let py=GRID*0.5; py<H; py+=GRID) {
    for (let px=GRID*0.5; px<W; px+=GRID) {
      // Bounding-box cull
      let near=false;
      for (let i=0; i<blobs.length; i++){
        const b=blobs[i],dx=px-b.x,dy=py-b.y;
        if (dx*dx+dy*dy<br[i]*br[i]*4.5){near=true;break;}
      }
      if (!near) continue;

      // Metaball field + weighted 3D sphere normals
      let field=0,wnx=0,wny=0,wnz=0,minD2=Infinity,nearest=blobs[0];
      for (let i=0; i<blobs.length; i++){
        const b=blobs[i],r=br[i],r2=r*r;
        const dx=px-b.x,dy=py-b.y;
        const d2=Math.max(dx*dx+dy*dy,0.01);
        const w=r2/d2;
        field+=w;
        const nxy2=Math.min(1,d2/r2);
        wnx+=(dx/r)*w; wny+=(dy/r)*w; wnz+=Math.sqrt(1-nxy2)*w;
        if (d2<minD2){minD2=d2;nearest=b;}
      }
      if (field<THRESH) continue;

      const atEdge=field<THRESH*1.14;

      const nn=Math.sqrt(wnx*wnx+wny*wny+wnz*wnz)||1;
      const nx=wnx/nn,ny=wny/nn,nz=wnz/nn;

      // Phong — diffuse + specular
      const NdotL=Math.max(0,nx*lx+ny*ly+nz*lz);
      const spec=Math.pow(Math.max(0,2*NdotL*nz-lz),32)*0.42;
      const bright=Math.min(1, atEdge ? 0.90 : (0.10+NdotL*0.72+spec));

      const ch=getChar(bright, px, py, t);
      if (ch===' '||ch==='`') continue;

      const dk=isDark?(nearest.type==='dark'?[8,8,8]:[18,18,18]):(nearest.type==='dark'?[30,28,26]:[58,56,54]);
      const lt=isDark?[255,255,255]:[226,222,216];
      const ri=Math.round(dk[0]+(lt[0]-dk[0])*bright);
      const gi=Math.round(dk[1]+(lt[1]-dk[1])*bright);
      const bi=Math.round(dk[2]+(lt[2]-dk[2])*bright);
      const style=`rgb(${ri},${gi},${bi})`;
      if (style!==prevStyle){ctx.fillStyle=style;prevStyle=style;}

      ctx.fillText(ch, px, py);
    }
  }

  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  blobs.forEach(b=>drawGlitter(ctx,b.x,b.y,b.r,b.glitter,t));
  tileGrain(ctx,0,0,W,H,grainX,grainY,0.22);
}

// ─── INPUT STATE ─────────────────────────────────────────
const mouse={x:-9999,y:-9999,sx:-9999,sy:-9999};
const tilt={x:0,y:0,sx:0,sy:0,active:false};

function stepInputs(){
  if (mouse.sx<-900){mouse.sx=mouse.x;mouse.sy=mouse.y;}
  else{mouse.sx+=(mouse.x-mouse.sx)*0.09;mouse.sy+=(mouse.y-mouse.sy)*0.09;}
  if (tilt.active){tilt.sx+=(tilt.x-tilt.sx)*0.22;tilt.sy+=(tilt.y-tilt.sy)*0.22;}
}

document.addEventListener('mousemove',e=>{
  const r=document.getElementById('heroCanvas').getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
});

(function(){
  const hero=document.querySelector('.hero');
  function onTouch(e){
    const r=hero.getBoundingClientRect(),t=e.touches[0];
    mouse.x=t.clientX-r.left; mouse.y=t.clientY-r.top;
  }
  hero.addEventListener('touchstart',onTouch,{passive:true});
  hero.addEventListener('touchmove',onTouch,{passive:true});
  hero.addEventListener('touchend',()=>{mouse.x=-9999;mouse.y=-9999;});
})();

const isMobile = window.matchMedia('(hover:none) and (pointer:coarse)').matches;

// Ambient gravity for mobile — Lissajous orbit, no permissions required
function ambientGravity(t) {
  if (!isMobile) return;
  tilt.x  = Math.sin(t * 0.18) * 0.10;
  tilt.y  = Math.cos(t * 0.13) * 0.08;
  tilt.sx = tilt.x;
  tilt.sy = tilt.y;
  tilt.active = true;
}

// Theme repaint hook — static (reduced-motion) canvases redraw on toggle
const repaintHooks=[];

// ─── HERO CANVAS ─────────────────────────────────────────
(function initHero(){
  const canvas=document.getElementById('heroCanvas');
  const ctx=canvas.getContext('2d');
  let W=0,H=0,blobs=null;

  const DEFS=[
    {nx:-0.07,ny:0.22,nr:0.28,type:'light',ph:0.0},
    {nx: 0.87,ny:0.10,nr:0.25,type:'light',ph:1.8},
    {nx: 0.52,ny:0.50,nr:0.30,type:'dark', ph:3.2},
    {nx: 0.20,ny:0.78,nr:0.25,type:'light',ph:2.3},
    {nx: 0.83,ny:0.84,nr:0.20,type:'light',ph:4.8},
  ];

  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=canvas.offsetWidth; H=canvas.offsetHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (blobs){const m=Math.min(W,H);DEFS.forEach((d,i)=>{blobs[i].hx=d.nx*W;blobs[i].hy=d.ny*H;blobs[i].r=d.nr*m;});}
    if (REDUCED && blobs) still();
  }
  resize();
  new ResizeObserver(resize).observe(canvas.parentElement);

  const m=Math.min(W,H);
  blobs=DEFS.map(d=>({x:d.nx*W,y:d.ny*H,hx:d.nx*W,hy:d.ny*H,r:d.nr*m,vx:0,vy:0,type:d.type,ph:d.ph,glitter:makeGlitter(200)}));

  function still(){ drawMetaballs(ctx,blobs,0,0,0,W,H,false); }
  if (REDUCED){ still(); repaintHooks.push(still); return; }

  let startT=null;
  function draw(ts){
    if (!startT) startT=ts;
    const t=(ts-startT)*0.001;
    ambientGravity(t);
    stepInputs();
    updateBlobs(blobs,mouse,tilt);
    const gx=Math.sin(t*2.1)*13,gy=Math.cos(t*1.8)*11;
    drawMetaballs(ctx,blobs,t,gx,gy,W,H,false);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ─── CLOCK — Punta del Este, exact time ───────────────────
(function(){
  const el=document.getElementById('clock');
  const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Montevideo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  function tick(){ el.innerHTML=fmt.format(new Date())+'<span class="tz"> \u00b7 UTC\u221203</span>'; }
  tick(); setInterval(tick,1000);
})();

// ─── THEME TOGGLE — paper (ID 01) ↔ ink (ID 02) ──────────
(function(){
  const btn=document.getElementById('themeToggle');
  function apply(){
    document.documentElement.dataset.theme=isDark?'dark':'light';
    btn.innerHTML=isDark?'◐ &nbsp;Paper':'◑ &nbsp;Ink';
    btn.setAttribute('aria-label', isDark?'Switch to paper (light) mode':'Switch to ink (dark) mode');
    repaintHooks.forEach(fn=>fn());
  }
  apply();
  btn.addEventListener('click',()=>{ isDark=!isDark; apply(); });
})();
</script>
